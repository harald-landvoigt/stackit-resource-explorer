name: Build and Publish Container Images

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Explicit image tag (leave blank to derive from git tag/branch)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  resolve-tags:
    name: Resolve Image Tags
    runs-on: ubuntu-latest
    outputs:
      primary_tag: ${{ steps.tag_calc.outputs.primary_tag }}
      additional_tags: ${{ steps.tag_calc.outputs.additional_tags }}
      frontend_tags: ${{ steps.tag_calc.outputs.frontend_tags }}
    steps:
      - name: Compute tags
        id: tag_calc
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          GIT_REF: ${{ github.ref }}
        run: |
          RAW_TAG=""
          if [ -n "${INPUT_TAG}" ]; then
            RAW_TAG="${INPUT_TAG}"
          elif [[ "${GIT_REF}" =~ ^refs/tags/ ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          fi

          if [ -n "${RAW_TAG}" ]; then
            if [[ ! "${RAW_TAG}" =~ ^[a-zA-Z0-9._-]+$ ]]; then
              echo "::error::Invalid image tag '${RAW_TAG}'. Only alphanumeric characters, '.', '_', and '-' are allowed."
              exit 1
            fi
            VERSION="${RAW_TAG#v}"
            if [[ "${VERSION}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(.*)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              SPECIAL="${BASH_REMATCH[4]}"
              PRIMARY_TAG="${VERSION}"
              if [ -z "${SPECIAL}" ]; then
                ADDITIONAL_TAGS="${MAJOR}.${MINOR},${MAJOR},latest,edge"
              else
                ADDITIONAL_TAGS="edge"
              fi
            else
              PRIMARY_TAG="${VERSION}"
              ADDITIONAL_TAGS="latest,edge"
            fi
          elif [ "${GIT_REF}" = "refs/heads/main" ] || [ "${GIT_REF}" = "refs/heads/master" ]; then
            PRIMARY_TAG="latest"
            ADDITIONAL_TAGS="edge"
          elif [[ "${GIT_REF}" =~ ^refs/heads/feat/ ]]; then
            PRIMARY_TAG="edge"
            ADDITIONAL_TAGS="sha-${GITHUB_SHA::7}"
          else
            PRIMARY_TAG="sha-${GITHUB_SHA::7}"
            ADDITIONAL_TAGS=""
          fi

          echo "primary_tag=${PRIMARY_TAG}" >> "$GITHUB_OUTPUT"
          echo "additional_tags=${ADDITIONAL_TAGS}" >> "$GITHUB_OUTPUT"

          REG_FRONTEND="ghcr.io/harald-landvoigt/stackit-resource-explorer/frontend"
          TAG_ARRAY=("$REG_FRONTEND:$PRIMARY_TAG")
          if [ -n "${ADDITIONAL_TAGS}" ]; then
            IFS="," read -ra LIST <<< "$ADDITIONAL_TAGS"
            for t in "${LIST[@]}"; do
              if [ -n "$t" ]; then
                TAG_ARRAY+=("$REG_FRONTEND:$t")
              fi
            done
          fi

          echo "frontend_tags<<EOF" >> "$GITHUB_OUTPUT"
          printf "%s\n" "${TAG_ARRAY[@]}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  publish-backend:
    name: Build & Publish Backend (Jib)
    runs-on: ubuntu-latest
    needs: resolve-tags
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build and Push Backend Image with Quarkus Jib
        working-directory: backend
        env:
          PRIMARY_TAG: ${{ needs.resolve-tags.outputs.primary_tag }}
          ADDITIONAL_TAGS: ${{ needs.resolve-tags.outputs.additional_tags }}
          QUARKUS_CONTAINER_IMAGE_USERNAME: ${{ github.actor }}
          QUARKUS_CONTAINER_IMAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTRA_JIB_ARGS=()
          if [ -n "${ADDITIONAL_TAGS}" ]; then
            EXTRA_JIB_ARGS+=("-Dquarkus.container-image.additional-tags=${ADDITIONAL_TAGS}")
          else
            EXTRA_JIB_ARGS+=("-Dquarkus.container-image.additional-tags=")
          fi
          ./mvnw package -DskipTests \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.registry=ghcr.io \
            -Dquarkus.container-image.group=harald-landvoigt/stackit-resource-explorer \
            -Dquarkus.container-image.name=backend \
            -Dquarkus.container-image.tag="${PRIMARY_TAG}" \
            "${EXTRA_JIB_ARGS[@]}"

  publish-frontend:
    name: Build & Publish Frontend (Docker Buildx)
    runs-on: ubuntu-latest
    needs: resolve-tags
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: ${{ needs.resolve-tags.outputs.frontend_tags }}
          build-args: |
            APP_VERSION=${{ needs.resolve-tags.outputs.primary_tag }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
