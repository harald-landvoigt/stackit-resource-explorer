name: Build and Publish Container Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Explicit image tag (leave blank to derive from git tag/branch)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  resolve-tags:
    name: Resolve Image Tags
    runs-on: ubuntu-latest
    outputs:
      primary_tag: ${{ steps.tag_calc.outputs.primary_tag }}
      additional_tags: ${{ steps.tag_calc.outputs.additional_tags }}
    steps:
      - name: Compute tags
        id: tag_calc
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            PRIMARY_TAG="${{ github.event.inputs.tag }}"
            ADDITIONAL_TAGS="latest"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            # Strip leading 'v' from tag: v0.1.0 -> 0.1.0
            VERSION="${GITHUB_REF_NAME#v}"
            PRIMARY_TAG="${VERSION}"
            ADDITIONAL_TAGS="latest"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PRIMARY_TAG="latest"
            ADDITIONAL_TAGS="edge"
          else
            PRIMARY_TAG="sha-${GITHUB_SHA::7}"
            ADDITIONAL_TAGS=""
          fi
          echo "primary_tag=${PRIMARY_TAG}" >> $GITHUB_OUTPUT
          echo "additional_tags=${ADDITIONAL_TAGS}" >> $GITHUB_OUTPUT

  publish-backend:
    name: Build & Publish Backend (Jib)
    runs-on: ubuntu-latest
    needs: resolve-tags
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build and Push Backend Image with Quarkus Jib
        working-directory: backend
        env:
          PRIMARY_TAG: ${{ needs.resolve-tags.outputs.primary_tag }}
          ADDITIONAL_TAGS: ${{ needs.resolve-tags.outputs.additional_tags }}
        run: |
          ./mvnw package -DskipTests \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.registry=ghcr.io \
            -Dquarkus.container-image.group=harald-landvoigt/stackit-resource-explorer \
            -Dquarkus.container-image.name=backend \
            -Dquarkus.container-image.tag="${PRIMARY_TAG}" \
            -Dquarkus.container-image.additional-tags="${ADDITIONAL_TAGS}" \
            -Dquarkus.container-image.username="${{ github.actor }}" \
            -Dquarkus.container-image.password="${{ secrets.GITHUB_TOKEN }}"

  publish-frontend:
    name: Build & Publish Frontend (Docker Buildx)
    runs-on: ubuntu-latest
    needs: resolve-tags
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/harald-landvoigt/stackit-resource-explorer/frontend:${{ needs.resolve-tags.outputs.primary_tag }}
            ${{ needs.resolve-tags.outputs.additional_tags != '' && format('ghcr.io/harald-landvoigt/stackit-resource-explorer/frontend:{0}', needs.resolve-tags.outputs.additional_tags) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
