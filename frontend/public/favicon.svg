<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Ambient Core Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#ff6f00" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ff6f00" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="40%" stop-color="#ff6f00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <!-- Top Slab Gradients -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc80"/>
      <stop offset="35%" stop-color="#ffa726"/>
      <stop offset="100%" stop-color="#ff6f00"/>
    </linearGradient>
    <linearGradient id="topLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="topRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </linearGradient>

    <!-- Mid Slab Gradients -->
    <linearGradient id="midFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa726"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="midLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#d84315"/>
    </linearGradient>
    <linearGradient id="midRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#a82900"/>
    </linearGradient>

    <!-- Bot Slab Gradients -->
    <linearGradient id="botFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="botLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </linearGradient>
    <linearGradient id="botRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d84315"/>
      <stop offset="100%" stop-color="#8c1c00"/>
    </linearGradient>

    <!-- Cloud Glow Filter -->
    <filter id="cloudGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#ffffff" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="128" height="128" rx="28" fill="#070707"/>
  <!-- Ambient Core Glow -->
  <circle cx="64" cy="62" r="52" fill="url(#bgGlow)"/>
  <!-- Sleek Accent Border -->
  <rect x="3" y="3" width="122" height="122" rx="25" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" stroke-opacity="0.9"/>

  <!-- LAYER 3 (Bottom - Foundation / Storage) -->
  <g transform="translate(0, 37)">
    <path d="M 19 50 L 64 74 L 64 84 L 19 60 Z" fill="url(#botLeft)"/>
    <path d="M 64 74 L 109 50 L 109 60 L 64 84 Z" fill="url(#botRight)"/>
    <path d="M 64 26 L 109 50 L 64 74 L 19 50 Z" fill="url(#botFace)"/>
  </g>

  <!-- LAYER 2 (Middle - Network) -->
  <g transform="translate(0, 18.5)">
    <path d="M 19 50 L 64 74 L 64 84 L 19 60 Z" fill="url(#midLeft)"/>
    <path d="M 64 74 L 109 50 L 109 60 L 64 84 Z" fill="url(#midRight)"/>
    <path d="M 64 26 L 109 50 L 64 74 L 19 50 Z" fill="url(#midFace)"/>
  </g>

  <!-- LAYER 1 (Top - Compute / Cloud) -->
  <g transform="translate(0, 0)">
    <path d="M 19 50 L 64 74 L 64 84 L 19 60 Z" fill="url(#topLeft)"/>
    <path d="M 64 74 L 109 50 L 109 60 L 64 84 Z" fill="url(#topRight)"/>
    <path d="M 64 26 L 109 50 L 64 74 L 19 50 Z" fill="url(#topFace)"/>

    <!-- Top Chamfer Highlight -->
    <path d="M 20 50 L 64 27 L 108 50" fill="none" stroke="#fff3e0" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

    <!-- Stylized Cloud Symbol in Perspective on Top Slab -->
    <g transform="translate(64, 49) scale(0.9, 0.48)" filter="url(#cloudGlow)">
      <path d="M -12 6 C -18 6 -21 1 -21 -4 C -21 -10 -16 -14 -10 -14 C -9 -19 -4 -23 3 -23 C 10 -23 15 -18 16 -12 C 21 -11 25 -7 25 -1 C 25 5 20 6 15 6 Z"
            fill="#ffffff" fill-opacity="0.95" stroke="#ffe0b2" stroke-width="1.5"/>
      <path d="M -8 1 C -12 1 -14 -2 -14 -5 C -14 -8 -11 -10 -7 -10 C -6 -13 -3 -16 2 -16 C 7 -16 11 -12 12 -8 C 15 -7 18 -4 18 0 C 18 4 14 1 11 1 Z"
            fill="#ff9800" fill-opacity="0.3"/>
    </g>
  </g>
</svg>
