services:
  database:
    image: postgres:15-alpine
    container_name: stackit-postgres
    restart: unless-stopped 
    environment:
      POSTGRES_DB: resource_explorer
      POSTGRES_USER: resource-explorer
      POSTGRES_PASSWORD: stackit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resource-explorer -d resource_explorer"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/harald-landvoigt/stackit-resource-explorer/backend:${IMAGE_TAG:-latest}
    container_name: stackit-backend
    restart: unless-stopped 
    environment:
      - QUARKUS_DATASOURCE_DB_KIND=postgresql
      - QUARKUS_DATASOURCE_USERNAME=resource-explorer
      - QUARKUS_DATASOURCE_PASSWORD=stackit
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://database:5432/resource_explorer
      - QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY=validate
      - STACKIT_SERVICE_ACCOUNT_KEY_PATH=/app/keys/scraper.json
      - STACKIT_REGIONS=${STACKIT_REGIONS:-eu01,eu02}
      - STACKIT_COMPUTE_SCHEDULE=1h
      - STACKIT_COMPUTE_DELAY=${STACKIT_COMPUTE_DELAY:-0s}
      - STACKIT_VMDISKS_SCHEDULE=1h
      - STACKIT_VMDISKS_DELAY=${STACKIT_VMDISKS_DELAY:-30s}
      - STACKIT_PUBLICIPS_SCHEDULE=1h
      - STACKIT_PUBLICIPS_DELAY=${STACKIT_PUBLICIPS_DELAY:-1m}
      - STACKIT_NETWORK_SCHEDULE=1h
      - STACKIT_NETWORK_DELAY=${STACKIT_NETWORK_DELAY:-1m30s}
      - STACKIT_NETWORK_VPC_SCHEDULE=1h
      - STACKIT_NETWORK_VPC_DELAY=${STACKIT_NETWORK_VPC_DELAY:-2m}
      - STACKIT_STORAGE_SCHEDULE=1h
      - STACKIT_STORAGE_DELAY=${STACKIT_STORAGE_DELAY:-2m30s}
      - STACKIT_S3_ENDPOINT_TEMPLATE=https://object.storage.%s.onstackit.cloud
      - STACKIT_DATABASE_SCHEDULE=1h
      - STACKIT_DATABASE_DELAY=${STACKIT_DATABASE_DELAY:-3m}
      - STACKIT_IAM_SCHEDULE=1h
      - STACKIT_IAM_DELAY=${STACKIT_IAM_DELAY:-3m30s}
      - STACKIT_DNS_SCHEDULE=1h
      - STACKIT_DNS_DELAY=${STACKIT_DNS_DELAY:-4m}
      - STACKIT_BILLING_SCHEDULE=1h
      - STACKIT_BILLING_DELAY=${STACKIT_BILLING_DELAY:-4m30s}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ${STACKIT_KEY_FILE:-./scraper.json}:/app/keys/scraper.json:ro

  frontend:
    image: ghcr.io/harald-landvoigt/stackit-resource-explorer/frontend:${IMAGE_TAG:-latest}
    container_name: stackit-frontend
    restart: unless-stopped 
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres_data:
